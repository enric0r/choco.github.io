[controllerEyebrow]
other = "THE CONTROLLER"
[whatItDoes]
other = "What ChoCo does"
[whatItDoesBody]
other = "ChoCo turns a small set of physical controls into scale-aware chords. The firmware runs on a Raspberry Pi Pico and sends standard MIDI notes over USB; a connected instrument makes the sound."
[featureScale]
other = "Play in a scale"
[featureScaleBody]
other = "Keys 0–6 select the seven degrees. A changes the root note, and B cycles through nine scales."
[featureChord]
other = "Change the chord"
[featureChordBody]
other = "Move the joystick for suspensions, sevenths, extensions and other variations. Returning to center restores the base triad."
[featureModes]
other = "Choose how it plays"
[featureModesBody]
other = "Latch, bass, strum, single-note and smart-voicing modes change how notes are played."
[featureDisplay]
other = "See the current state"
[featureDisplayBody]
other = "The OLED shows the selected key and scale, chord name, active modes and harmonic suggestions."
[projectEyebrow]
other = "USE & BUILD"
[projectHeading]
other = "Documentation and files"
[projectBody]
other = "The handbook is a single page with a side index. It covers first use, controls, board connections, firmware, configuration and troubleshooting. The prototype’s printed back is shaped like a chocolate bar."
