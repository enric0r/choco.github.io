[whatItDoes]
other = "Cosa fa ChoCo"
[whatItDoesBody]
other = "ChoCo usa pochi controlli fisici per creare accordi coerenti con la scala scelta. Il firmware gira su Raspberry Pi Pico e invia note MIDI via USB; il suono viene prodotto dallo strumento collegato."
[featureScale]
other = "Suona in una scala"
[featureScaleBody]
other = "I tasti 0–6 selezionano i sette gradi. A cambia la tonica e B scorre le nove scale."
[featureChord]
other = "Cambia accordo"
[featureChordBody]
other = "Muovi il joystick per ottenere sospensioni, settime, estensioni e altre varianti. Tornando al centro ripristini la triade di base."
[featureModes]
other = "Scegli come suonare"
[featureModesBody]
other = "Le modalità latch, basso, strum, nota singola e smart voicing cambiano il modo in cui vengono suonate le note."
[featureDisplay]
other = "Controlla lo stato"
[featureDisplayBody]
other = "L’OLED mostra tonica e scala, nome dell’accordo, modalità attive e suggerimenti armonici."
