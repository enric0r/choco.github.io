<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#25140f">
  <meta name="description" content="{{ .Params.description | default .Site.Title }}">
  <title>{{ if .IsHome }}ChoCo · USB MIDI chord controller{{ else }}{{ .Title }} · ChoCo{{ end }}</title>
  <link rel="icon" href="{{ "favicon.ico" | relURL }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <script src="{{ "js/site.js" | relURL }}" defer></script>
</head>
<body class="{{ if .IsHome }}is-home{{ else if eq .Section "docs" }}is-docs{{ else }}is-about{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="ChoCo home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>ChoCo<span class="brand-dot">.</span></span>
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="{{ "docs/" | relURL }}" {{ if eq .Section "docs" }}aria-current="page"{{ end }}>Documentation</a>
        <a href="{{ "about/" | relURL }}" {{ if eq .RelPermalink ("about/" | relURL) }}aria-current="page"{{ end }}>About</a>
        <a class="nav-github" href="https://github.com/enric0r/ChoCo" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main id="main">{{ block "main" . }}{{ end }}</main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <div>
        <span class="footer-brand">ChoCo<span>.</span></span>
        <p>RP2040 USB MIDI chord controller.</p>
      </div>
      <div class="footer-links">
        <a href="{{ "docs/" | relURL }}">Handbook</a>
        <a href="{{ "about/" | relURL }}">About</a>
        <a href="https://github.com/enric0r/ChoCo">Source code ↗</a>
      </div>
    </div>
  </footer>
</body>
</html>
