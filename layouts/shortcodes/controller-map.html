<figure class="controller-map">
  <div class="controller-map-title"><strong>{{ i18n "mapTitle" }}</strong><span>{{ i18n "mapFront" }}</span></div>
  <div class="controller-map-main">
    <div class="controller-diagram" aria-label="{{ i18n "mapAria" }}">
      <div class="diagram-left">
        <div class="diagram-oled" aria-hidden="true"><span>C ION　D1</span><strong>C Maj</strong><span>NEXT　5 4 6</span></div>
        <div class="diagram-joystick"><span class="joystick-knob" aria-hidden="true"></span><span>JOYSTICK</span></div>
      </div>
      <div class="diagram-keypad" aria-label="{{ i18n "keypadAria" }}">
        <div class="diagram-key diagram-key-mod"><strong>A</strong><small>{{ i18n "rootPlus" }}</small></div>
        <div class="diagram-key diagram-key-mod"><strong>B</strong><small>{{ i18n "scale" }}</small></div>
        <div class="diagram-key diagram-key-mod"><strong>C</strong><small>{{ i18n "modifier" }}</small></div>
        <div class="diagram-spacer"></div>
        <div class="diagram-key">1</div><div class="diagram-key">3</div><div class="diagram-key">5</div><div class="diagram-spacer"></div>
        <div class="diagram-key">0</div><div class="diagram-key">2</div><div class="diagram-key">4</div><div class="diagram-key">6</div>
      </div>
    </div>
    <div class="controller-map-legend">
      <p><strong>0–6</strong> {{ i18n "mapDegrees" }}</p>
      <p><strong>A</strong> {{ i18n "mapRoot" }} <strong>B</strong> {{ i18n "mapNextScale" }}</p>
      <p><strong>C</strong> {{ i18n "mapModifier" }}</p>
      <p><strong>{{ i18n "stickTilt" }}</strong> {{ i18n "stickTiltBody" }}</p>
      <p><strong>{{ i18n "stickPress" }}</strong> {{ i18n "stickPressBody" }}</p>
    </div>
  </div>
  <div class="controller-map-shortcuts">
    <span class="shortcut-heading">{{ i18n "withC" }}</span>
    <div><b>C + 0–6</b><span>{{ i18n "cycleInversion" }}</span></div>
    <div><b>C + A</b><span>{{ i18n "toggleLatch" }}</span></div>
    <div><b>C + B</b><span>{{ i18n "printHistory" }}</span></div>
    <div><b>{{ i18n "stickLeftRight" }}</b><span>{{ i18n "octave" }}</span></div>
    <div><b>{{ i18n "stickDown" }}</b><span>{{ i18n "variationMap" }}</span></div>
    <div><b>{{ i18n "shortPress" }}</b><span>{{ i18n "toggleBass" }}</span></div>
    <div><b>{{ i18n "longPress" }}</b><span>{{ i18n "toggleVoicing" }}</span></div>
    <div><b>{{ i18n "strumPress" }}</b><span>{{ i18n "toggleStrum" }}</span></div>
  </div>
  <figcaption>{{ i18n "mapCaption" }}</figcaption>
</figure>
