<figure class="controller-map">
  <div class="controller-map-title"><strong>ChoCo control map</strong><span>Front view · firmware key labels</span></div>
  <div class="controller-map-main">
    <div class="controller-diagram" aria-label="ChoCo board: OLED at top left, joystick below, and three keypad rows A B C, 1 3 5, 0 2 4 6 on the right">
      <div class="diagram-left">
        <div class="diagram-oled" aria-hidden="true"><span>C ION　D1</span><strong>C Maj</strong><span>NEXT　5 4 6</span></div>
        <div class="diagram-joystick"><span class="joystick-knob" aria-hidden="true"></span><span>JOYSTICK</span></div>
      </div>
      <div class="diagram-keypad" aria-label="Keypad layout">
        <div class="diagram-key diagram-key-mod"><strong>A</strong><small>ROOT +1</small></div>
        <div class="diagram-key diagram-key-mod"><strong>B</strong><small>SCALE</small></div>
        <div class="diagram-key diagram-key-mod"><strong>C</strong><small>MODIFIER</small></div>
        <div class="diagram-spacer"></div>
        <div class="diagram-key">1</div><div class="diagram-key">3</div><div class="diagram-key">5</div><div class="diagram-spacer"></div>
        <div class="diagram-key">0</div><div class="diagram-key">2</div><div class="diagram-key">4</div><div class="diagram-key">6</div>
      </div>
    </div>
    <div class="controller-map-legend">
      <p><strong>0–6</strong> Play scale degrees 1–7. A newly pressed degree takes over.</p>
      <p><strong>A</strong> Raise the root by one semitone. <strong>B</strong> Select the next scale.</p>
      <p><strong>C</strong> Hold as a modifier for the shortcuts below.</p>
      <p><strong>Joystick tilt</strong> Vary a held chord; center restores its base triad.</p>
      <p><strong>Joystick press</strong> Short: stop the chord. Long: toggle single-note mode.</p>
    </div>
  </div>
  <div class="controller-map-shortcuts">
    <span class="shortcut-heading">WITH C HELD</span>
    <div><b>C + 0–6</b><span>Cycle inversion</span></div>
    <div><b>C + A</b><span>Toggle latch on A release</span></div>
    <div><b>C + B</b><span>Print history if serial logging is on</span></div>
    <div><b>C + stick ← / →</b><span>Octave down / up</span></div>
    <div><b>C + stick ↓</b><span>Cycle variation map</span></div>
    <div><b>C + short press</b><span>Toggle bass</span></div>
    <div><b>C + long press</b><span>Toggle smart voicing</span></div>
    <div><b>C + A + short press</b><span>Toggle strum instead of latch</span></div>
  </div>
  <figcaption>Control positions are schematic. The OLED and joystick are to the left of the keypad on the board.</figcaption>
</figure>
