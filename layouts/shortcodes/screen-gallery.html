<div class="screen-gallery" aria-label="{{ i18n "screensAria" }}">
  <figure><div class="screen-bezel"><img src="{{ "images/oled-idle.svg" | relURL }}" alt="{{ i18n "idleAlt" }}" loading="lazy" width="512" height="256"></div><figcaption><strong>{{ i18n "idleTitle" }}</strong><span>{{ i18n "idleCaption" }}</span></figcaption></figure>
  <figure><div class="screen-bezel"><img src="{{ "images/oled-playing.svg" | relURL }}" alt="{{ i18n "playingAlt" }}" loading="lazy" width="512" height="256"></div><figcaption><strong>{{ i18n "playingTitle" }}</strong><span>{{ i18n "playingCaption" }}</span></figcaption></figure>
  <figure><div class="screen-bezel"><img src="{{ "images/oled-edit.svg" | relURL }}" alt="{{ i18n "editAlt" }}" loading="lazy" width="512" height="256"></div><figcaption><strong>{{ i18n "editTitle" }}</strong><span>{{ i18n "editCaption" }}</span></figcaption></figure>
</div>
